<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسبيح</title>
</head>
<style>
    *
    {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body
    {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-image: url("image/tesbhee.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    .main-div
    {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background-color: black;
        border-radius: 10px;
        border: 1px solid rgb(249, 249, 169);
        color: yellow;
        padding: 2rem;
        width: 30%;
        box-shadow: 0px 0px 30px 5px yellow;
        button
        {
            background-color: yellow;
            color: black;
            padding: .5rem 2rem;
            margin-top: 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    }
</style>
<body>
    <div class="main-div">
        <h1 id="title">ابدأ التسبيح</h1>
        <button id="start">ابدأ</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
